<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="jam:team" content="b79917fc-80c6-4de1-9047-c98fa5db0aff" />
    <link rel="stylesheet" href="/src/index.css" />
    <script src="/src/bootstrap.ts" type="module"></script>
    <!-- The shell for app routes. scripts/prerender.mjs writes the public pages
         from it with their own title, description, canonical URL and JSON-LD. -->
    <title>DebateLab</title>
    <meta name="description" content="DebateLab is an AI debate prep and practice app for students and debaters: cases, rebuttals, evidence, coaching and timed rounds against an AI opponent." />
    <meta name="author" content="DebateLab by Pi-Stack" />
    <!-- The shell for /app, /login and /share. Prerender replaces this with the
         public index directive on pages that have a canonical URL. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DebateLab by Pi-Stack" />
    <meta property="og:title" content="DebateLab by Pi-Stack | AI Debate Prep, Cases & Rebuttals" />
    <meta property="og:description" content="DebateLab is an AI debate prep and practice app for students and debaters: cases, rebuttals, evidence, coaching and timed rounds against an AI opponent." />
    <meta property="og:image" content="https://debate.pi-stack.org/hero-visual.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DebateLab debate prep workspace preview" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DebateLab by Pi-Stack | AI Debate Prep" />
    <meta name="twitter:description" content="DebateLab is an AI debate prep and practice app for students and debaters: cases, rebuttals, evidence, coaching and timed rounds against an AI opponent." />
    <meta name="twitter:image" content="https://debate.pi-stack.org/hero-visual.jpg" />
    <meta name="twitter:image:alt" content="DebateLab debate prep workspace preview" />
    <script src="/theme-init.js"></script>
    <style>
      body {
        margin: 0;
        background: #f1f5f9;
        color: #0f172a;
      }

      html.dark body {
        background: #0f172a;
        color: #f8fafc;
      }

      #root > .app-startup-shell,
      #root > .app-bootstrap-error {
        display: grid;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
        box-sizing: border-box;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .app-startup-shell__card {
        width: min(100%, 28rem);
        padding: 28px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        background: #f8fafc;
        box-shadow: 0 1px 3px rgb(15 23 42 / 0.08);
        text-align: center;
      }

      html.dark .app-startup-shell__card {
        border-color: #334155;
        background: #1e293b;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.24);
      }

      .app-startup-shell__brand {
        color: #0284c7;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .app-startup-shell__status {
        margin: 12px 0 0;
        font-size: 1rem;
      }

      #root > .app-bootstrap-error {
        display: grid;
      }

      .app-bootstrap-error h1 {
        margin: 12px 0 0;
        font-size: 1.25rem;
      }

      .app-bootstrap-error p {
        margin: 8px 0 20px;
      }

      .app-bootstrap-error button {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        background: #0284c7;
        color: #f8fafc;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <main class="app-startup-shell" data-startup-shell aria-busy="true" aria-label="DebateLab is loading">
        <div class="app-startup-shell__card">
          <span class="app-startup-shell__brand">DebateLab</span>
          <p class="app-startup-shell__status" data-startup-status role="status">Loading DebateLab</p>
        </div>
      </main>
    </div>
    <noscript>
      <main style="max-width: 40rem; margin: 0 auto; padding: 48px 20px; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6;">
        <h1>DebateLab by Pi-Stack</h1>
        <p>DebateLab needs JavaScript to run. Read about it on the <a href="/">home page</a> or in the <a href="/ai-debate-practice">AI debate practice guide</a>.</p>
      </main>
    </noscript>
  </body>
</html>
