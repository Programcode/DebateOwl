map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:18480;
    server_name codex-remote.tailab0ab3.ts.net;

    if ($host !~ ^(codex-remote\.tailab0ab3\.ts\.net:18443|127\.0\.0\.1:18480)$) { return 444; }

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://*.jam.dev; worker-src 'self' blob:; frame-src 'self' https://accounts.google.com https://*.jam.dev; connect-src 'self' wss://codex-remote.tailab0ab3.ts.net:18443 https://*.jam.dev https://oauth2.googleapis.com https://www.googleapis.com;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /supabase/ {
        proxy_pass http://127.0.0.1:54321/;
        proxy_set_header Host 127.0.0.1:54321;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /collaboration {
        proxy_pass http://127.0.0.1:12345;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 127.0.0.1:12345;
        proxy_read_timeout 1h;
    }

    location ^~ /access/ {
        proxy_pass http://127.0.0.1:12345;
        proxy_set_header Host 127.0.0.1:12345;
    }

    location ^~ /review/ {
        proxy_pass http://127.0.0.1:12345;
        proxy_set_header Host 127.0.0.1:12345;
    }

    location ~ /\. { return 404; }
    location ~* \.(?:env|log|lock|md|ya?ml)$ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
