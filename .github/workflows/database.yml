name: Database

# Local Supabase, pgTAP, and the full-stack browser journeys. About 20 minutes,
# so pull requests run it only when they touch the backend, the stores and
# clients that talk to it, or the gate itself. Pushes to main use the same
# filter, and the weekly run catches frontend-only regressions.
on:
  pull_request:
    paths:
      - "supabase/**"
      - "services/collaboration/**"
      - "src/lib/supabase/**"
      - "src/lib/stores/**"
      - "src/lib/ai/**"
      - "e2e/full-stack/**"
      - "e2e/workspace-collaboration.spec.ts"
      - "playwright.workspace.config.ts"
      - ".superset/db-gate.sh"
      - ".superset/lib/**"
      - ".superset/workspace-test.env"
      - "scripts/test-*.sh"
      - "scripts/workspace-test-env.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database.yml"
  push:
    branches: [ "main" ]
    paths:
      - "supabase/**"
      - "services/collaboration/**"
      - "src/lib/supabase/**"
      - "src/lib/stores/**"
      - "src/lib/ai/**"
      - "e2e/full-stack/**"
      - "e2e/workspace-collaboration.spec.ts"
      - "playwright.workspace.config.ts"
      - ".superset/db-gate.sh"
      - ".superset/lib/**"
      - ".superset/workspace-test.env"
      - "scripts/test-*.sh"
      - "scripts/workspace-test-env.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database.yml"
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Database and real workspace journey
        env:
          # ghcr.io rate-limits shared runners; the same images are on ECR.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
          WORKSPACE_GATE_ARTIFACT_ROOT: ${{ runner.temp }}/workspace-gate
        run: ./.superset/db-gate.sh

      - name: Upload workspace failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-gate-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workspace-gate/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
