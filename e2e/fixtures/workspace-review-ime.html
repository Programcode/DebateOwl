<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace IME review gate</title>
  </head>
  <body>
    <div id="suggestion-editor"></div>
    <script type="module">
      import * as Y from "yjs";
      import { createWorkspaceEditor } from "/src/lib/workspace/editor-schema.ts";
      import * as review from "/src/lib/workspace/review.ts";

      let phase = "idle";
      let proposal = null;
      let proposalId = "ime";
      let canonicalUpdates = 0;
      const events = [];
      let suggesting = false;
      const yDocument = new Y.Doc();
      const editor = createWorkspaceEditor(yDocument, {
        isSuggesting: () => suggesting,
        onSuggestion(hunk) {
          proposal = review.createProposal({
            id: proposalId,
            authorId: "ime-member",
            documentEpoch: 1,
            editor,
            hunks: [hunk],
          });
        },
      });
      editor.commands.setContent("<p>Accepted:</p>");
      yDocument.on("update", () => canonicalUpdates += 1);
      suggesting = true;
      document.querySelector("#suggestion-editor").append(editor.view.dom);

      for (const type of ["compositionstart", "beforeinput", "input", "compositionend"]) {
        editor.view.dom.addEventListener(type, (event) => {
          if (type === "compositionstart") phase = "composing";
          if (type === "compositionend") phase = "settled";
          events.push({
            type,
            data: event.data ?? null,
            inputType: event.inputType ?? null,
            isComposing: event.isComposing ?? null,
          });
        });
      }

      const snapshot = () => ({
        canonical: editor.getText(),
        canonicalUpdates,
        suggestion: editor.getText(),
        editorComposing: editor.view.composing,
        phase,
        events: [...events],
        proposal: proposal && {
          status: proposal.hunks[0].status,
          replacement: proposal.hunks[0].replacement,
        },
      });

      window.workspaceIme = {
        snapshot,
        capture(id) {
          proposalId = id;
          return snapshot();
        },
        accept() {
          suggesting = false;
          proposal = review.acceptProposalHunks({
            editor,
            documentEpoch: 1,
            proposal,
            hunkIds: [proposal.hunks[0].id],
          });
          suggesting = true;
          return snapshot();
        },
        reject() {
          proposal = review.rejectProposalHunks({
            proposal,
            hunkIds: [proposal.hunks[0].id],
          });
          return snapshot();
        },
        resetSuggestion() {
          phase = "idle";
          proposal = null;
          events.length = 0;
          return snapshot();
        },
      };
    </script>
  </body>
</html>
