<!doctype html><html><head><meta charset="utf-8"><title>DebateLab iOS mocks</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--dl-bg:#eef4fa;--dl-card:#f8fafc;--dl-fg:#0f172a;--dl-sub:#475569;--dl-faint:#64748b;--dl-primary:#0284c7;--dl-teal:#14b8a6;--dl-tile:#e0f2fe;--dl-border:#cbd5e1;--dl-line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--foreground,#0f172a)}
.wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px 20px;justify-items:center}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
figcaption{font-size:13px;line-height:1.5;color:var(--muted-foreground,#64748b);width:320px}
figcaption b{display:block;color:var(--foreground,#0f172a);font-size:14px;font-weight:600;margin-bottom:2px}
.phone{width:320px;height:680px;border-radius:48px;background:#0b1220;padding:9px;box-shadow:0 0 0 1px rgba(127,127,127,.28),0 20px 44px -22px rgba(15,23,42,.55);flex-shrink:0}
.screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--dl-bg);color:var(--dl-fg);font-size:13px;line-height:1.4;font-family:Inter,system-ui,sans-serif;font-feature-settings:"cv11","ss01"}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:90px;height:26px;border-radius:20px;background:#000;z-index:40}
.status{height:46px;display:flex;justify-content:space-between;align-items:center;padding:4px 24px 0 30px;font-weight:600;font-size:13px;position:relative;z-index:5}
.status .sb{display:flex;gap:5px;align-items:center}
.status .sb svg{width:16px;height:12px}
.status .bat{width:23px;height:11px;border:1.4px solid currentColor;border-radius:3.5px;padding:1.4px;opacity:.9}
.status .bat i{display:block;height:100%;width:78%;background:currentColor;border-radius:1.5px}
.home-ind{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:108px;height:4px;border-radius:3px;background:var(--dl-fg);opacity:.85;z-index:30}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:80px;padding-top:7px;display:flex;justify-content:space-around;background:rgba(248,250,252,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--dl-line);z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#94a3b8;width:58px}
.tab.on{color:var(--dl-primary)}
.tab svg{width:22px;height:22px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:18px;height:18px;flex-shrink:0}
.body{padding:2px 16px 96px;height:calc(100% - 46px);overflow:hidden}
.ctx{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--dl-primary);background:var(--dl-tile);border-radius:999px;padding:5px 10px 5px 11px}
.ctx svg{width:14px;height:14px}
h1.motion{font-size:21px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:10px 0 12px}
h1.big{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:6px 0 12px}
.seg{display:flex;background:#e2e8f0;border-radius:9px;padding:2px;font-size:12px;font-weight:600}
.seg span{flex:1;text-align:center;padding:6px 0;border-radius:7px;color:var(--dl-sub)}
.seg span.on{background:#fff;color:var(--dl-fg);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.stats{display:flex;gap:18px;margin:10px 2px 12px;font-size:12px;color:var(--dl-faint)}
.stats b{display:block;font-size:17px;color:var(--dl-fg);font-weight:700;letter-spacing:-.01em}
.card{background:var(--dl-card);border:1px solid var(--dl-border);border-radius:14px}
.sec{font-size:15px;font-weight:700;margin:14px 2px 7px;letter-spacing:-.01em}
.tile-ic{width:32px;height:32px;border-radius:9px;background:var(--dl-tile);color:var(--dl-primary);display:grid;place-items:center;flex-shrink:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{padding:9px 10px;display:flex;align-items:center;gap:9px}
.tile b{font-size:13px;font-weight:600}
.tile small{display:block;font-size:11px;color:var(--dl-faint);margin-top:1px}
.row{display:flex;align-items:center;gap:11px;padding:10px 12px}
.row+.row{border-top:1px solid var(--dl-line)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:11.5px;color:var(--dl-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#94a3b8;width:16px;height:16px}
.grad{background:linear-gradient(115deg,#0284c7 0%,#0ea5e9 45%,#14b8a6 100%);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--dl-primary);color:#fff}
.btn.outline{background:#fff;border:1px solid var(--dl-border);color:var(--dl-fg)}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 6px;color:var(--dl-primary);font-size:15px}
.navbar .back{display:flex;align-items:center;gap:1px}
.navbar .acts{display:flex;gap:16px}
.navbar svg{width:21px;height:21px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--dl-border);background:#fff;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:500;color:var(--dl-sub);white-space:nowrap}
.chip.on{background:var(--dl-tile);border-color:#7dd3fc;color:#075985}
.chip svg{width:13px;height:13px}
.cite{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:5px;background:var(--dl-tile);color:#075985;font-size:10px;font-weight:700;vertical-align:1px}
.tile small{display:none}
body{padding:24px;background:#fff}</style></head><body>
<div class="wrap">

<figure>
<div class="phone"><div class="screen" style="background:radial-gradient(120% 70% at 50% 30%,#13304a 0%,#0f172a 60%);color:#f1f5f9">
  <div class="island"></div><div class="status"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 16px 0">
    <span style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center"><i data-i="x"></i></span>
    <div style="text-align:center"><b style="font-size:13px;display:block">Con R1</b><small style="font-size:11px;color:#94a3b8">Turn 4 of 8, Tournament</small></div>
    <span style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center"><i data-i="flow"></i></span>
  </div>
  <div style="display:flex;justify-content:center;margin-top:22px;position:relative">
    <svg width="208" height="208" viewBox="0 0 208 208" style="transform:rotate(-90deg)">
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
      <circle cx="104" cy="104" r="94" fill="none" stroke="rgba(148,163,184,.18)" stroke-width="9"/>
      <circle cx="104" cy="104" r="94" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="590.6" stroke-dashoffset="153"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <span style="font-size:11.5px;color:#94a3b8;font-weight:500">AI opponent speaking</span>
      <span style="font-size:52px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1">4:26</span>
      <span style="font-size:11.5px;color:#94a3b8">of 6:00</span>
    </div>
  </div>
  <div style="display:flex;justify-content:center;align-items:center;gap:3px;height:34px;margin:16px 0 6px">
    <script>document.write(Array.from({length:34},(_,k)=>'<span style="width:3px;border-radius:2px;background:'+(k<22?'#7dd3fc':'rgba(148,163,184,.35)')+';height:'+(6+Math.round(Math.abs(Math.sin(k*1.7)*Math.cos(k*.45))*26))+'px"></span>').join(''))</script>
  </div>
  <div style="margin:4px 18px 0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(148,163,184,.18);font-size:14.5px;line-height:1.45;color:#cbd5e1">
    …and the proposition never tells us what happens to the nurse who drives in at five a.m. <span style="color:#fff;font-weight:600">when no bus runs at that hour.</span>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:30px;display:flex;align-items:center;justify-content:space-evenly">
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:#94a3b8"><span style="width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#f1f5f9"><i data-i="pause"></i></span>Pause</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#94a3b8"><span class="grad" style="width:76px;height:76px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 7px rgba(56,189,248,.14),0 10px 30px -6px rgba(20,184,166,.6)"><i data-i="mic" style="width:30px;height:30px"></i></span>Your R2 is next</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:#94a3b8"><span style="width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#f1f5f9"><i data-i="skip"></i></span>Skip</div>
  </div>
  <div class="home-ind" style="background:#f1f5f9"></div>
</div></div>
<figcaption><b>Sparring, live</b>Full screen with no tab bar. The ring is the speech timer. You hear the opponent while the captions follow along, and a light tap tells you when your turn starts. The flow button top right opens your notes without leaving the round.</figcaption>
</figure>

<figure>
<div class="phone"><div class="screen" style="background:#f8fafc">
  <div class="island"></div><div class="status"></div>
  <div class="navbar"><span class="back"><i data-i="chevl"></i>Practice</span><span class="acts"><i data-i="share"></i></span></div>
  <div class="body" style="padding-top:0;height:calc(100% - 82px)">
    <div style="font-size:12px;color:var(--dl-faint);margin-top:2px">Round review</div>
    <h1 class="big" style="font-size:25px;margin:2px 0 12px">You won the ballot</h1>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div class="card grad" style="flex:1;border:0;padding:11px 12px;border-radius:14px"><small style="font-size:11.5px;opacity:.9">Your score</small><div style="font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1">78</div></div>
      <div class="card" style="flex:1;padding:11px 12px"><small style="font-size:11.5px;color:var(--dl-faint)">Opponent score</small><div style="font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--dl-sub)">71</div></div>
    </div>
    <div class="card" style="padding:12px 12px 6px">
      <b style="font-size:13px">Category balance</b><small style="display:block;color:var(--dl-faint);font-size:11px;margin-bottom:8px">Each category is scored out of 25.</small>
      <script>document.write([['Logic',21,18],['Evidence',15,19],['Delivery',22,17],['Strategy',20,17]].map(([n,u,a])=>'<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="font-weight:600">'+n+'</span><span style="color:var(--dl-faint);font-variant-numeric:tabular-nums">'+u+' vs '+a+'</span></div><div style="position:relative;height:7px;border-radius:4px;background:#e2e8f0"><div style="position:absolute;left:0;top:0;bottom:0;width:'+(u/25*100)+'%;border-radius:4px;background:var(--dl-primary)"></div><div style="position:absolute;top:-2px;width:2px;height:11px;background:#475569;left:'+(a/25*100)+'%"></div></div></div>').join(''))</script>
    </div>
    <div class="card" style="padding:11px 12px;margin-top:8px">
      <b style="font-size:13px">Judge's verdict</b>
      <p style="margin:4px 0 0;font-size:12.5px;color:var(--dl-sub)">Your R2 answered the night-shift worker case directly. Evidence was thin: name the transit data, don't just say it exists.</p>
    </div>
  </div>
  <div style="position:absolute;left:12px;right:12px;bottom:24px;display:flex;gap:8px;z-index:20">
    <div class="btn outline" style="flex:1"><i data-i="history"></i>Replay</div>
    <div class="btn primary" style="flex:1.4">Start another round</div>
  </div>
  <div class="home-ind"></div>
</div></div>
<figcaption><b>Scorecard</b>The same scorecard as the web (Logic, Evidence, Delivery and Strategy out of 25) as bars instead of the radar chart, which reads badly at phone width. Replay plays your speeches back with the transcript.</figcaption>
</figure>

<figure>
<div class="phone"><div class="screen" style="background:#f8fafc">
  <div class="island"></div><div class="status"></div>
  <div class="navbar" style="padding-bottom:8px;border-bottom:1px solid var(--dl-line)"><span class="back"><i data-i="chevl"></i></span><div style="text-align:center;color:var(--dl-fg)"><b style="font-size:14px;display:block">Ask</b><small style="font-size:10.5px;color:var(--dl-faint)">Ban private cars from city centres</small></div><span class="acts"><i data-i="history"></i></span></div>
  <div style="padding:12px 14px 0">
    <div style="display:flex;justify-content:flex-end"><div style="max-width:78%;background:var(--dl-primary);color:#fff;padding:9px 12px;border-radius:16px 16px 5px 16px;font-size:13px">How do I answer "what about the nurse who drives in at 5 a.m."?</div></div>
    <div style="margin-top:12px;font-size:13px;line-height:1.5">
      <p style="margin:0 0 7px">Concede the edge case, then shrink it. Three moves:</p>
      <p style="margin:0 0 5px"><b>Exemptions exist.</b> Every real ban permits shift workers and carers. <span class="cite">1</span></p>
      <p style="margin:0 0 5px"><b>Night buses follow demand.</b> Cities that closed their centres added routes in the first year. <span class="cite">2</span></p>
      <p style="margin:0;color:var(--dl-sub)"><b style="color:var(--dl-fg)">Flip it.</b> The same nurse breathes the air on her walk from the car park<span style="display:inline-block;width:7px;height:14px;background:var(--dl-primary);margin-left:2px;vertical-align:-2px;border-radius:1px"></span></p>
    </div>
    <div style="display:flex;gap:6px;margin-top:10px"><span class="chip"><span class="cite">1</span>City exemptions policy</span><span class="chip"><span class="cite">2</span>Transit report</span></div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:8px 12px 26px;background:rgba(248,250,252,.92);backdrop-filter:blur(16px);border-top:1px solid var(--dl-line)">
    <div style="display:flex;gap:6px;margin-bottom:8px;overflow:hidden"><span class="chip on"><i data-i="quote"></i>Citations</span><span class="chip"><i data-i="globe"></i>Web search</span><span class="chip"><i data-i="list"></i>Pros/Cons</span><span class="chip">Sonnet 5 <i data-i="chevd"></i></span></div>
    <div style="display:flex;align-items:center;gap:8px"><span style="width:34px;height:34px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;color:var(--dl-sub)"><i data-i="plus"></i></span><div style="flex:1;height:38px;border-radius:19px;border:1px solid var(--dl-border);background:#fff;display:flex;align-items:center;padding:0 6px 0 14px;color:#94a3b8;font-size:13px">Ask your coach<span style="flex:1"></span><span style="width:28px;height:28px;border-radius:50%;background:var(--dl-primary);color:#fff;display:grid;place-items:center"><i data-i="mic" style="width:15px;height:15px"></i></span></div></div>
  </div>
  <div class="home-ind"></div>
</div></div>
<figcaption><b>Ask</b>A chat that streams token by token. The web's toggles (Citations, Web search, Pros/Cons, model) turn into one row of chips above the composer. The mic does dictation, so you can ask out loud between speeches.</figcaption>
</figure>

<figure>
<div class="phone"><div class="screen" style="background:#f8fafc">
  <div class="island"></div><div class="status"></div>
  <div class="navbar"><span class="back"><i data-i="chevl"></i>Prepare</span><span class="acts"><i data-i="plus"></i><i data-i="more"></i></span></div>
  <div style="padding:0 16px"><h1 class="big" style="font-size:25px;margin:2px 0 10px">Flowchart</h1>
  <div class="seg" style="margin-bottom:12px"><span class="on">Flow</span><span>Map</span></div></div>
  <div style="display:flex;gap:10px;padding:0 0 0 16px;overflow:hidden">
    <script>
    const cols=[['Pro Introductor','#0284c7',['Air quality is a health duty','Streets belong to people']],['Con Introductor','#0d9488',['Shift workers have no alternative','Small shops lose customers']],['Pro R1','#0284c7',['Exemptions for carers','Footfall rises after closures']]];
    document.write(cols.map(([h,c,items],ci)=>'<div style="width:134px;flex-shrink:0"><div style="font-size:11px;font-weight:700;color:'+c+';margin-bottom:6px;padding-left:2px">'+h+'</div>'+items.map((t,ii)=>'<div style="position:relative;background:#fff;border:1px solid var(--dl-border);border-left:3px solid '+c+';border-radius:10px;padding:8px 9px;font-size:12px;font-weight:500;line-height:1.3;margin-bottom:'+(ii===0?'34':'10')+'px;'+(ci===1&&ii===0?'box-shadow:0 0 0 2px #7dd3fc;':'')+'">'+t+'</div>').join('')+'</div>').join(''))
    </script>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;top:400px;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 28px rgba(15,23,42,.14);padding:8px 16px 0;z-index:15">
    <div style="width:36px;height:5px;border-radius:3px;background:#cbd5e1;margin:0 auto 10px"></div>
    <div style="font-size:11px;font-weight:700;color:#0d9488">Con Introductor</div>
    <b style="font-size:15px;display:block;margin:2px 0 6px">Shift workers have no alternative</b>
    <div style="font-size:12px;color:var(--dl-sub);margin-bottom:10px">Answered by 1 claim in Pro R1. Not yet answered in Pro R2.</div>
    <div style="display:flex;gap:7px"><span class="chip on"><i data-i="sparkles"></i>Suggest a response</span><span class="chip"><i data-i="link"></i>Link claim</span></div>
  </div>
  <div class="home-ind"></div>
</div></div>
<figcaption><b>Flowchart</b>A phone flow is speeches as columns you swipe through sideways, not a canvas you pinch around. Tapping a claim opens a sheet showing what answers it and what's still unanswered. The full map stays one tab away.</figcaption>
</figure>
