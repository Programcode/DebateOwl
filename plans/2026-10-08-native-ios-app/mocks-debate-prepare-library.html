<!doctype html><html><head><meta charset="utf-8"><title>DebateLab iOS mocks</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--dl-bg:#eef4fa;--dl-card:#f8fafc;--dl-fg:#0f172a;--dl-sub:#475569;--dl-faint:#64748b;--dl-primary:#0284c7;--dl-teal:#14b8a6;--dl-tile:#e0f2fe;--dl-border:#cbd5e1;--dl-line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--foreground,#0f172a)}
.wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px 20px;justify-items:center}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
figcaption{font-size:13px;line-height:1.5;color:var(--muted-foreground,#64748b);width:320px}
figcaption b{display:block;color:var(--foreground,#0f172a);font-size:14px;font-weight:600;margin-bottom:2px}
.phone{width:320px;height:680px;border-radius:48px;background:#0b1220;padding:9px;box-shadow:0 0 0 1px rgba(127,127,127,.28),0 20px 44px -22px rgba(15,23,42,.55);flex-shrink:0}
.screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--dl-bg);color:var(--dl-fg);font-size:13px;line-height:1.4;font-family:Inter,system-ui,sans-serif;font-feature-settings:"cv11","ss01"}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:90px;height:26px;border-radius:20px;background:#000;z-index:40}
.status{height:46px;display:flex;justify-content:space-between;align-items:center;padding:4px 24px 0 30px;font-weight:600;font-size:13px;position:relative;z-index:5}
.status .sb{display:flex;gap:5px;align-items:center}
.status .sb svg{width:16px;height:12px}
.status .bat{width:23px;height:11px;border:1.4px solid currentColor;border-radius:3.5px;padding:1.4px;opacity:.9}
.status .bat i{display:block;height:100%;width:78%;background:currentColor;border-radius:1.5px}
.home-ind{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:108px;height:4px;border-radius:3px;background:var(--dl-fg);opacity:.85;z-index:30}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:80px;padding-top:7px;display:flex;justify-content:space-around;background:rgba(248,250,252,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--dl-line);z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#94a3b8;width:58px}
.tab.on{color:var(--dl-primary)}
.tab svg{width:22px;height:22px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:18px;height:18px;flex-shrink:0}
.body{padding:2px 16px 96px;height:calc(100% - 46px);overflow:hidden}
.ctx{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--dl-primary);background:var(--dl-tile);border-radius:999px;padding:5px 10px 5px 11px}
.ctx svg{width:14px;height:14px}
h1.motion{font-size:21px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:10px 0 12px}
h1.big{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:6px 0 12px}
.seg{display:flex;background:#e2e8f0;border-radius:9px;padding:2px;font-size:12px;font-weight:600}
.seg span{flex:1;text-align:center;padding:6px 0;border-radius:7px;color:var(--dl-sub)}
.seg span.on{background:#fff;color:var(--dl-fg);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.stats{display:flex;gap:18px;margin:10px 2px 12px;font-size:12px;color:var(--dl-faint)}
.stats b{display:block;font-size:17px;color:var(--dl-fg);font-weight:700;letter-spacing:-.01em}
.card{background:var(--dl-card);border:1px solid var(--dl-border);border-radius:14px}
.sec{font-size:15px;font-weight:700;margin:14px 2px 7px;letter-spacing:-.01em}
.tile-ic{width:32px;height:32px;border-radius:9px;background:var(--dl-tile);color:var(--dl-primary);display:grid;place-items:center;flex-shrink:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{padding:9px 10px;display:flex;align-items:center;gap:9px}
.tile b{font-size:13px;font-weight:600}
.tile small{display:block;font-size:11px;color:var(--dl-faint);margin-top:1px}
.row{display:flex;align-items:center;gap:11px;padding:10px 12px}
.row+.row{border-top:1px solid var(--dl-line)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:11.5px;color:var(--dl-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#94a3b8;width:16px;height:16px}
.grad{background:linear-gradient(115deg,#0284c7 0%,#0ea5e9 45%,#14b8a6 100%);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--dl-primary);color:#fff}
.btn.outline{background:#fff;border:1px solid var(--dl-border);color:var(--dl-fg)}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 6px;color:var(--dl-primary);font-size:15px}
.navbar .back{display:flex;align-items:center;gap:1px}
.navbar .acts{display:flex;gap:16px}
.navbar svg{width:21px;height:21px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--dl-border);background:#fff;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:500;color:var(--dl-sub);white-space:nowrap}
.chip.on{background:var(--dl-tile);border-color:#7dd3fc;color:#075985}
.chip svg{width:13px;height:13px}
.cite{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:5px;background:var(--dl-tile);color:#075985;font-size:10px;font-weight:700;vertical-align:1px}
.tile small{display:none}
body{padding:24px;background:#fff}</style></head><body>
