server {
    listen 80;
    
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; frame-src 'self' https://accounts.google.com; connect-src 'self' https://uziwdtkzofptihahfooo.supabase.co https://*.supabase.co https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://r.jina.ai https://s.jina.ai https://oauth2.googleapis.com https://www.googleapis.com;" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    set $robots_tag "";
    if ($uri ~ ^/(app(?:/|$)|login$|share/)) { set $robots_tag "noindex, nofollow"; }
    add_header X-Robots-Tag $robots_tag always;

    # Do not cache runtime bootstraps so config and theme behavior update instantly.
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /theme-init.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SEO: Serve robots.txt and sitemap.xml directly (bypass SPA fallback and .txt block)
    location = /robots.txt {
        allow all;
        default_type text/plain;
        alias /usr/share/nginx/html/robots.txt;
    }

    location = /sitemap.xml {
        allow all;
        default_type application/xml;
        try_files $uri =404;
    }

    # SECURITY: Block access to sensitive files
    location ~* \.(md|env|log|yml|yaml|json|lock|git|gitignore|dockerignore)$ {
        deny all;
        return 404;
    }

    # SECURITY: Block hidden files and directories
    location ~ /\. {
        deny all;
        return 404;
    }

    # Private/authenticated app surfaces should be reachable for users but not indexed.
    location = /app {
        try_files /index.html =404;
    }

    location ^~ /app/ {
        try_files /index.html =404;
    }

    location = /login {
        try_files /index.html =404;
    }

    location ^~ /share/ {
        try_files /index.html =404;
    }

    location / {
        # Serve public SEO directories at extensionless URLs without forcing a trailing slash.
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # Cache other static assets (images, fonts, etc.)
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Cache JS/CSS bundles (Vite adds hashes to these, so caching is safe)
    location ~* \.(?:css|js)$ {
        # But exclude config.js which we handled above
        if ($request_uri ~* "config\.js") {
            return 404; # Should not happen due to the = /config.js block above
        }
        expires 1y;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
