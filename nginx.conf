server {
    listen 80;
    
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # NEW: Do not cache the config file so keys can be updated instantly
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache other static assets (images, fonts, etc.)
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Cache JS/CSS bundles (Vite adds hashes to these, so caching is safe)
    location ~* \.(?:css|js)$ {
        # But exclude config.js which we handled above
        if ($request_uri ~* "config\.js") {
            return 404; # Should not happen due to the = /config.js block above
        }
        expires 1y;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}