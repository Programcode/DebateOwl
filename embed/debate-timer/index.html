<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The embeddable timer: framed on other sites, so it loads only its own
         bundle (no app shell, analytics, recorder or service worker) and stays
         out of search results in favour of the tool page. -->
    <title>Debate timer | DebateLab</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://debate.pi-stack.org/tools/debate-timer" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="48x48" />
    <script src="/src/embed/debate-timer.tsx" type="module"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 16px;">This timer needs JavaScript. <a href="https://debate.pi-stack.org/tools/debate-timer" target="_blank" rel="noopener">Open the debate timer by DebateLab</a>.</p>
    </noscript>
  </body>
</html>
